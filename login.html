
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALCOBLOCK - Acceso</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="styles/login.css">
</head>

<body>

    <div class="container">
        <div class="login-container">

            <h2>ALCOBLOCK</h2>

            <!-- MENSAJES -->
            <div id="message" class="alert alert-danger d-none" role="status"></div>

            <!-- FORMULARIO LOGIN -->
            <form id="loginForm">

                <div class="mb-3 input-group-custom">
                    <label for="loginEmail" class="form-label">
                        Correo Electrónico
                    </label>

                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>

                        <input type="email"
                               class="form-control"
                               id="loginEmail"
                               name="email"
                               required
                               placeholder="correo@empresa.com">
                    </div>
                </div>

                <div class="mb-3 input-group-custom">
                    <label for="loginPassword" class="form-label">
                        Contraseña
                    </label>

                    <div class="input-icon">
                        <i class="fas fa-lock"></i>

                        <input type="password"
                               class="form-control"
                               id="loginPassword"
                               name="password"
                               required
                               placeholder="********">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Iniciar Sesión
                </button>

                <div class="toggle-link">
                    ¿No tienes cuenta?
                    <span onclick="toggleForm()">Regístrate aquí</span>
                </div>

            </form>

            <!-- FORMULARIO REGISTRO -->
            <form id="registerForm" class="d-none">

                <div class="mb-3 input-group-custom">
                    <label for="registerName" class="form-label">
                        Nombre Completo
                    </label>

                    <div class="input-icon">
                        <i class="fas fa-user"></i>

                        <input type="text"
                               class="form-control"
                               id="registerName"
                               name="nombre"
                               required
                               placeholder="Ej. Juan Pérez">
                    </div>
                </div>

                <div class="mb-3 input-group-custom">
                    <label for="registerEmail" class="form-label">
                        Correo Electrónico
                    </label>

                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>

                        <input type="email"
                               class="form-control"
                               id="registerEmail"
                               name="email"
                               required
                               placeholder="correo@empresa.com">
                    </div>
                </div>

                <div class="mb-3 input-group-custom">
                    <label for="registerPassword" class="form-label">
                        Contraseña
                    </label>

                    <div class="input-icon">
                        <i class="fas fa-lock"></i>

                        <input type="password"
                               class="form-control"
                               id="registerPassword"
                               name="password"
                               minlength="6"
                               required
                               placeholder="Mínimo 6 caracteres">
                    </div>
                </div>

                <div class="mb-3 input-group-custom">
                    <label for="registerRole" class="form-label">
                        Rol asignado
                    </label>

                    <div class="input-icon">
                        <i class="fas fa-user-shield"></i>

                        <select class="form-select"
                                id="registerRole"
                                name="rol"
                                required>

                            <option value="Operador">Operador</option>
                            <option value="Supervisor">Supervisor</option>
                            <option value="Administrador">Administrador</option>

                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Crear Cuenta
                </button>

                <div class="toggle-link">
                    ¿Ya tienes cuenta?
                    <span onclick="toggleForm()">Inicia sesión</span>
                    <img src="img/Logo.png" alt="" width="100">
                </div>


            </form>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="app.js"></script>

</body>
</html>
