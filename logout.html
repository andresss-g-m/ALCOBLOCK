
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cerrando sesión - ALCOBLOCK</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="logout.css">

</head>

<body>

    <div class="logout-container text-center">

        <i class="fas fa-right-from-bracket logout-icon"></i>

        <h2>Cerrando sesión</h2>

        <p class="text-muted">
            Volviendo al inicio de sesión...
        </p>

        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>

        <p class="mt-3">
            <a href="login.html">Haz clic aquí si no eres redirigido automáticamente.</a>
        </p>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="logout.js"></script>

</body>
</html>
